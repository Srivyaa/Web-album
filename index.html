<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Album</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Album Grid View -->
    <div id="gridView" class="container">
        <div class="header">
            <h1>My Album</h1>
            <button class="btn-upload" id="btnUpload">+ Upload</button>
        </div>
        <div class="album-grid" id="albumGrid">
            <!-- Images will be dynamically loaded here -->
        </div>
    </div>

    <!-- Full Screen Photo Viewer -->
    <div id="photoViewer" class="photo-viewer hidden">
        <div class="viewer-header">
            <button class="btn-back" id="btnBack">← Back</button>
            <span class="photo-counter"><span id="currentPhoto">1</span> / <span id="totalPhotos">0</span></span>
        </div>
        
        <div class="viewer-container">
            <div class="photo-wrapper">
                <img id="mainPhoto" class="main-photo" src="" alt="Photo">
            </div>
        </div>

        <div class="viewer-controls">
            <button class="btn-nav btn-prev" id="btnPrev">‹</button>
            <button class="btn-nav btn-next" id="btnNext">›</button>
            <button class="btn-action" id="btnShare" title="Share">↗</button>
            <button class="btn-action" id="btnDownload" title="Download">⬇</button>
        </div>

        <!-- Thumbnail Strip -->
        <div class="thumbnail-strip" id="thumbnailStrip">
            <!-- Thumbnails will be loaded here -->
        </div>
    </div>

    <!-- Hidden file input for uploads -->
    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">

    <script src="script.js"></script>
</body>
</html>
